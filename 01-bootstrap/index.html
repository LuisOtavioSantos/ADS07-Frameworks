<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor da Esquina | Cardápio com Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <header class="navbar navbar-dark bg-primary">
      <nav class="container">
        <a class="navbar-brand fw-bold" href="#">Sabor da Esquina</a>
        <span class="navbar-text text-white">Feito com Bootstrap</span>
      </nav>
    </header>

    <main class="container text-center py-5">
      <h1 class="display-5 mb-4">Olá, estudante! Esta página usa Bootstrap.</h1>
      <h2 class="h4 mb-3">Cardápio</h2>

      <ul class="row g-3 list-unstyled">
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">Pizza</h3>
            <p class="card-text">R$ 45.00</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">X-Bacon</h3>
            <p class="card-text">R$ 28.90</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">X-Burguer</h3>
            <p class="card-text">R$ 24.90</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">Refri</h3>
            <p class="card-text">R$ 7.00</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">Salgado</h3>
            <p class="card-text">R$ 8.50</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
        <li class="col-12 col-sm-6 col-lg-4">
          <article class="card card-body h-100 shadow-sm">
            <h3 class="card-title h5">Pastel</h3>
            <p class="card-text">R$ 12.00</p>
            <button class="btn btn-primary">Adicionar</button>
          </article>
        </li>
      </ul>
    </main>

    <footer class="bg-dark text-center text-white-50 py-4">© 2026 Sabor da Esquina · Exemplo da Aula 3</footer>
  </body>
</html>
